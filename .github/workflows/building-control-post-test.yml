name: Test CKAN POST transport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/building-control-post-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test NBCO and Cork SQL over POST
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import subprocess

          result = {"checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(), "checks": {}}

          def post(name, url, sql, referer):
              command = [
                  "curl", "--silent", "--show-error", "--location", "--compressed",
                  "--max-time", "90",
                  "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36",
                  "--header", "Accept: application/json,text/plain,*/*",
                  "--header", f"Referer: {referer}",
                  "--write-out", "\n__HTTP_STATUS__:%{http_code}",
                  "--data-urlencode", f"sql={sql}",
                  url
              ]
              completed = subprocess.run(command, capture_output=True, text=True)
              body, _, status = completed.stdout.rpartition("\n__HTTP_STATUS__:")
              entry = {"http_status": int(status or 0), "curl_exit": completed.returncode, "body_preview": body[:500]}
              try:
                  payload = json.loads(body)
                  entry["success"] = payload.get("success")
                  if payload.get("success"):
                      entry["records"] = payload.get("result", {}).get("records", [])
              except Exception as error:
                  entry["parse_error"] = repr(error)
              result["checks"][name] = entry

          start = dt.date.today().replace(year=dt.date.today().year - 5).isoformat()
          nbco_sql = f'''SELECT count(*) AS count FROM "0774e781-7af8-46da-b623-872e74cf541e" WHERE "CN_Number" IS NOT NULL AND GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= 3 AND ("CN_Date_Submitted_or_Received" >= '{start}'::timestamp OR "CN_Validation_Date" >= '{start}'::timestamp OR "CN_Commencement_Date" >= '{start}'::timestamp OR "CCC_Date_Validated" >= '{start}'::timestamp)'''
          post("nbco_post", "https://data.nbco.gov.ie/api/3/action/datastore_search_sql", nbco_sql, "https://data.nbco.gov.ie/dataset/bcnccc/resource/0774e781-7af8-46da-b623-872e74cf541e")

          cork_sql = '''SELECT count(*) AS count FROM "8d5bbfa9-3b0c-40ac-8630-4243bed94b2d" WHERE COALESCE("NumResidentialUnits",0) >= 3'''
          post("cork_post", "https://data.corkcity.ie/api/3/action/datastore_search_sql", cork_sql, "https://data.corkcity.ie/dataset/planning-permission")

          statuses = [entry.get("http_status") for entry in result["checks"].values()]
          successes = [entry.get("success") for entry in result["checks"].values()]
          result["status"] = "passed" if statuses == [200, 200] and successes == [True, True] else "failed"
          path = pathlib.Path("validation/building-control-post-test.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit POST result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-post-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record CKAN POST validation"
            git push
          fi
