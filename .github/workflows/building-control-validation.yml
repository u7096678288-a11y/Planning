name: Validate building-control pipeline

on:
  push:
    branches: [main]
    paths:
      - building-control-match-core.js
      - completions-five-year.js
      - dashboard-building-control-five-year.js
      - completions.html
      - tests/building-control-core.test.js
      - .github/workflows/building-control-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-control-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source, matching, live-service and Pages checks
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import urllib.parse

          result = {
              "status": "running",
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "commit": os.environ.get("GITHUB_SHA_VALUE", ""),
              "checks": {}
          }
          required = []

          def curl_text(url, timeout=60, referer="https://data.nbco.gov.ie/"):
              command = [
                  "curl", "--fail", "--silent", "--show-error", "--location", "--compressed",
                  "--retry", "2", "--retry-delay", "2", "--max-time", str(timeout),
                  "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36",
                  "--header", "Accept: application/json,text/javascript,text/plain,text/html,*/*",
                  "--header", f"Referer: {referer}",
                  url
              ]
              completed = subprocess.run(command, check=True, capture_output=True, text=True)
              return completed.stdout

          def parse_json_or_jsonp(body):
              value = body.strip()
              if value.startswith("{") or value.startswith("["):
                  return json.loads(value)
              first = value.find("(")
              last = value.rfind(")")
              if first >= 0 and last > first:
                  return json.loads(value[first + 1:last])
              raise ValueError(f"Response was neither JSON nor JSONP: {value[:180]}")

          def curl_json(url, timeout=60, referer="https://data.nbco.gov.ie/"):
              return parse_json_or_jsonp(curl_text(url, timeout=timeout, referer=referer))

          def check(name, function, required_check=True):
              if required_check:
                  required.append(name)
              try:
                  value = function()
                  if isinstance(value, dict):
                      value = {"status": "passed", **value}
                  else:
                      value = {"status": "passed", "value": value}
                  result["checks"][name] = value
              except Exception as error:
                  result["checks"][name] = {
                      "status": "failed",
                      "error": repr(error)
                  }

          def syntax_check():
              files = [
                  "building-control-match-core.js",
                  "completions-five-year.js",
                  "dashboard-building-control-five-year.js"
              ]
              for filename in files:
                  subprocess.run(["node", "--check", filename], check=True, capture_output=True, text=True)
              return {"files": files}

          def matching_check():
              unit = subprocess.run(
                  ["node", "tests/building-control-core.test.js"],
                  check=True,
                  capture_output=True,
                  text=True
              )
              return json.loads(unit.stdout)

          today = dt.date.today()
          try:
              start = today.replace(year=today.year - 5)
          except ValueError:
              start = today.replace(year=today.year - 5, day=28)
          start_text = start.isoformat()

          def nbco_check():
              resource = "0774e781-7af8-46da-b623-872e74cf541e"
              unit_clause = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= 3'
              date_clause = f'''("CN_Date_Submitted_or_Received" >= '{start_text}'::timestamp OR "CN_Validation_Date" >= '{start_text}'::timestamp OR "CN_Commencement_Date" >= '{start_text}'::timestamp OR "CCC_Date_Validated" >= '{start_text}'::timestamp)'''
              sql = f'''SELECT count(*) AS count FROM "{resource}" WHERE "CN_Number" IS NOT NULL AND {unit_clause} AND {date_clause}'''
              url = "https://data.nbco.gov.ie/api/3/action/datastore_search_sql?" + urllib.parse.urlencode({"sql": sql, "callback": "__nbcoValidation"})
              payload = curl_json(url, referer="https://u7096678288-a11y.github.io/Planning/completions.html")
              if not payload.get("success"):
                  raise RuntimeError(f"NBCO JSONP query failed: {payload}")
              count = int(payload.get("result", {}).get("records", [{}])[0].get("count", 0))
              if count <= 0:
                  raise RuntimeError("NBCO five-year 3+ dwelling query returned no records")
              return {"transport": "JSONP", "window_start": start_text, "qualifying_relationship_rows": count}

          def planning_check():
              parameters = {
                  "f": "json",
                  "where": "NumResidentialUnits >= 3 AND ReceivedDate >= DATE '2014-01-01'",
                  "returnCountOnly": "true"
              }
              url = "https://services.arcgis.com/NzlPQPKn5QF9v2US/arcgis/rest/services/IrishPlanningApplications/FeatureServer/0/query?" + urllib.parse.urlencode(parameters)
              payload = curl_json(url, referer="https://u7096678288-a11y.github.io/Planning/")
              if payload.get("error"):
                  raise RuntimeError(f"Planning query failed: {payload['error']}")
              count = int(payload.get("count", 0))
              if count <= 0:
                  raise RuntimeError("Planning 3+ dwelling query returned no records")
              return {"qualifying_records": count}

          def cork_check():
              resource = "8d5bbfa9-3b0c-40ac-8630-4243bed94b2d"
              sql = f'''SELECT count(*) AS count FROM "{resource}" WHERE COALESCE("NumResidentialUnits",0) >= 3'''
              url = "https://data.corkcity.ie/api/3/action/datastore_search_sql?" + urllib.parse.urlencode({"sql": sql, "callback": "__corkValidation"})
              payload = curl_json(url, referer="https://u7096678288-a11y.github.io/Planning/completions.html")
              if not payload.get("success"):
                  raise RuntimeError(f"Cork City JSONP query failed: {payload}")
              count = int(payload.get("result", {}).get("records", [{}])[0].get("count", 0))
              return {"transport": "JSONP", "qualifying_records": count}

          def pages_check():
              page_url = "https://u7096678288-a11y.github.io/Planning/completions.html"
              expected = [
                  "building-control-match-core.js?v=20260804-1",
                  "completions-five-year.js?v=20260804-1",
                  "Commencements & Completions"
              ]
              page = ""
              last_error = None
              for _attempt in range(12):
                  try:
                      page = curl_text(page_url, timeout=30, referer="https://github.com/u7096678288-a11y/Planning")
                      if all(value in page for value in expected):
                          break
                  except Exception as error:
                      last_error = error
                  time.sleep(10)
              missing = [value for value in expected if value not in page]
              if missing:
                  raise RuntimeError(f"GitHub Pages missing expected content {missing}; last error={last_error!r}")
              asset_lengths = {}
              for asset in [
                  "building-control-match-core.js?v=20260804-1",
                  "completions-five-year.js?v=20260804-1",
                  "dashboard-building-control-five-year.js?v=20260804-1"
              ]:
                  body = curl_text("https://u7096678288-a11y.github.io/Planning/" + asset, timeout=30, referer=page_url)
                  asset_lengths[asset] = len(body)
                  if len(body) < 1000:
                      raise RuntimeError(f"Published asset is unexpectedly short: {asset}")
              return {"page": page_url, "asset_lengths": asset_lengths}

          check("javascript_syntax", syntax_check)
          check("matching_tests", matching_check)
          check("nbco_live_jsonp", nbco_check)
          check("planning_live", planning_check)
          check("cork_city_live_jsonp", cork_check)
          check("github_pages", pages_check)

          failed = [name for name in required if result["checks"].get(name, {}).get("status") != "passed"]
          result["status"] = "passed" if not failed else "failed"
          result["failed_checks"] = failed

          path = pathlib.Path("validation/building-control-test.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          sys.exit(0 if not failed else 1)
          PY

      - name: Commit validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record building-control validation"
            git push
          fi
