name: Validate building-control pipeline

on:
  push:
    branches: [main]
    paths:
      - building-control-match-core.js
      - completions-five-year.js
      - dashboard-building-control-five-year.js
      - completions.html
      - tests/building-control-core.test.js
      - .github/workflows/building-control-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: building-control-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source, matching, live-service and Pages checks
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import urllib.parse
          import urllib.request

          result = {
              "status": "running",
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "commit": os.environ.get("GITHUB_SHA_VALUE", ""),
              "checks": {}
          }
          exit_code = 0

          def request_json(url, data=None, timeout=60):
              headers = {"User-Agent": "Radharc-Planning-Validation/1.0"}
              encoded = None if data is None else urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(url, data=encoded, headers=headers)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def request_text(url, timeout=30):
              request = urllib.request.Request(url, headers={"User-Agent": "Radharc-Planning-Validation/1.0"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read().decode("utf-8", errors="replace")

          try:
              files = [
                  "building-control-match-core.js",
                  "completions-five-year.js",
                  "dashboard-building-control-five-year.js"
              ]
              for filename in files:
                  subprocess.run(["node", "--check", filename], check=True, capture_output=True, text=True)
              result["checks"]["javascript_syntax"] = {"status": "passed", "files": files}

              unit = subprocess.run(
                  ["node", "tests/building-control-core.test.js"],
                  check=True,
                  capture_output=True,
                  text=True
              )
              result["checks"]["matching_tests"] = json.loads(unit.stdout)

              today = dt.date.today()
              try:
                  start = today.replace(year=today.year - 5)
              except ValueError:
                  start = today.replace(year=today.year - 5, day=28)
              start_text = start.isoformat()

              nbco_resource = "0774e781-7af8-46da-b623-872e74cf541e"
              unit_clause = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= 3'
              date_clause = f'''("CN_Date_Submitted_or_Received" >= '{start_text}'::timestamp OR "CN_Validation_Date" >= '{start_text}'::timestamp OR "CN_Commencement_Date" >= '{start_text}'::timestamp OR "CCC_Date_Validated" >= '{start_text}'::timestamp)'''
              nbco_sql = f'''SELECT count(*)::integer AS count FROM "{nbco_resource}" WHERE "CN_Number" IS NOT NULL AND {unit_clause} AND {date_clause}'''
              nbco_url = "https://data.nbco.gov.ie/api/3/action/datastore_search_sql?" + urllib.parse.urlencode({"sql": nbco_sql})
              nbco = request_json(nbco_url)
              if not nbco.get("success"):
                  raise RuntimeError(f"NBCO query failed: {nbco}")
              nbco_count = int(nbco.get("result", {}).get("records", [{}])[0].get("count", 0))
              if nbco_count <= 0:
                  raise RuntimeError("NBCO five-year 3+ dwelling query returned no records")
              result["checks"]["nbco_live"] = {
                  "status": "passed",
                  "window_start": start_text,
                  "qualifying_relationship_rows": nbco_count
              }

              planning = request_json(
                  "https://services.arcgis.com/NzlPQPKn5QF9v2US/arcgis/rest/services/IrishPlanningApplications/FeatureServer/0/query",
                  {
                      "f": "json",
                      "where": "NumResidentialUnits >= 3 AND ReceivedDate >= DATE '2014-01-01'",
                      "returnCountOnly": "true"
                  }
              )
              if planning.get("error"):
                  raise RuntimeError(f"Planning query failed: {planning['error']}")
              planning_count = int(planning.get("count", 0))
              if planning_count <= 0:
                  raise RuntimeError("Planning 3+ dwelling query returned no records")
              result["checks"]["planning_live"] = {"status": "passed", "qualifying_records": planning_count}

              cork_resource = "8d5bbfa9-3b0c-40ac-8630-4243bed94b2d"
              cork_sql = f'''SELECT count(*)::integer AS count FROM "{cork_resource}" WHERE COALESCE("NumResidentialUnits",0) >= 3'''
              cork_url = "https://data.corkcity.ie/api/3/action/datastore_search_sql?" + urllib.parse.urlencode({"sql": cork_sql})
              cork = request_json(cork_url)
              if not cork.get("success"):
                  raise RuntimeError(f"Cork City query failed: {cork}")
              cork_count = int(cork.get("result", {}).get("records", [{}])[0].get("count", 0))
              result["checks"]["cork_city_live"] = {"status": "passed", "qualifying_records": cork_count}

              page_url = "https://u7096678288-a11y.github.io/Planning/completions.html"
              expected = [
                  "building-control-match-core.js?v=20260804-1",
                  "completions-five-year.js?v=20260804-1",
                  "Commencements &amp; Completions"
              ]
              page = ""
              for attempt in range(12):
                  try:
                      page = request_text(page_url)
                      if all(value in page for value in expected):
                          break
                  except Exception:
                      pass
                  time.sleep(10)
              missing = [value for value in expected if value not in page]
              if missing:
                  raise RuntimeError(f"GitHub Pages did not expose the new completions page assets: {missing}")

              for asset in [
                  "building-control-match-core.js?v=20260804-1",
                  "completions-five-year.js?v=20260804-1",
                  "dashboard-building-control-five-year.js?v=20260804-1"
              ]:
                  body = request_text("https://u7096678288-a11y.github.io/Planning/" + asset)
                  if len(body) < 1000:
                      raise RuntimeError(f"Published asset is unexpectedly short: {asset}")
              result["checks"]["github_pages"] = {"status": "passed", "page": page_url}

              result["status"] = "passed"
          except Exception as error:
              result["status"] = "failed"
              result["error"] = repr(error)
              exit_code = 1
          finally:
              path = pathlib.Path("validation/building-control-test.json")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(result, indent=2, sort_keys=True))

          sys.exit(exit_code)
          PY

      - name: Commit validation result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record building-control validation"
            git push
          fi
