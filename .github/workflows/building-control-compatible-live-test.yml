name: Test compatible building-control SQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/building-control-compatible-live-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query NBCO and Cork with public-compatible SQL
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import subprocess

          result = {"checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(), "checks": {}}

          def query(name, url, sql, referer):
              command = [
                  "curl", "--silent", "--show-error", "--location", "--compressed",
                  "--max-time", "120",
                  "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/127 Safari/537.36",
                  "--header", "Accept: application/json,text/plain,*/*",
                  "--header", f"Referer: {referer}",
                  "--write-out", "\n__HTTP_STATUS__:%{http_code}",
                  "--data-urlencode", f"sql={sql}",
                  url
              ]
              completed = subprocess.run(command, capture_output=True, text=True)
              body, _, status = completed.stdout.rpartition("\n__HTTP_STATUS__:")
              entry = {"http_status": int(status or 0), "curl_exit": completed.returncode, "body_preview": body[:500]}
              try:
                  payload = json.loads(body)
                  entry["success"] = payload.get("success")
                  if payload.get("success"):
                      records = payload.get("result", {}).get("records", [])
                      entry["record_count"] = len(records)
                      entry["records"] = records[:5]
              except Exception as error:
                  entry["parse_error"] = repr(error)
              result["checks"][name] = entry
              return entry

          today = dt.date.today()
          try:
              start = today.replace(year=today.year - 5)
          except ValueError:
              start = today.replace(year=today.year - 5, day=28)
          start_text = start.isoformat()

          unit_clause = '(("CN_Units_for_phase" >= 3) OR ("CN_Total_Number_of_Dwelling_Units" >= 3) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= 3) OR ("CCC_Units_Completed" >= 3))'
          date_clause = f'''("CN_Date_Submitted_or_Received" >= '{start_text}'::timestamp OR "CN_Validation_Date" >= '{start_text}'::timestamp OR "CN_Commencement_Date" >= '{start_text}'::timestamp OR "CCC_Date_Validated" >= '{start_text}'::timestamp)'''
          nbco_base = f'''FROM "0774e781-7af8-46da-b623-872e74cf541e" WHERE "CN_Number" IS NOT NULL AND {unit_clause} AND {date_clause}'''
          nbco_url = "https://data.nbco.gov.ie/api/3/action/datastore_search_sql"
          nbco_referer = "https://u7096678288-a11y.github.io/Planning/completions.html"
          query("nbco_count", nbco_url, f"SELECT count(*) AS count {nbco_base}", nbco_referer)
          query(
              "nbco_sample",
              nbco_url,
              f'''SELECT "CN_Number","CN_Planning_Permission_Number","CN_Commencement_Date","CN_Units_for_phase","CCC_Number","CCC_Date_Validated","CCC_Units_Completed","LocalAuthority" {nbco_base} ORDER BY "CN_Date_Submitted_or_Received" DESC NULLS LAST, "CN_Validation_Date" DESC NULLS LAST, "CN_Commencement_Date" DESC NULLS LAST, "CCC_Date_Validated" DESC NULLS LAST LIMIT 5''',
              nbco_referer
          )
          query(
              "nbco_reference_ilike",
              nbco_url,
              f'''SELECT "CN_Number","CN_Planning_Permission_Number" {nbco_base} AND "CN_Planning_Permission_Number" ILIKE '%2%0%2%' LIMIT 5''',
              nbco_referer
          )

          cork_url = "https://data.corkcity.ie/api/3/action/datastore_search_sql"
          cork_referer = "https://u7096678288-a11y.github.io/Planning/completions.html"
          query(
              "cork_count",
              cork_url,
              '''SELECT count(*) AS count FROM "8d5bbfa9-3b0c-40ac-8630-4243bed94b2d" WHERE "NumResidentialUnits" >= 3''',
              cork_referer
          )
          query(
              "cork_sample",
              cork_url,
              '''SELECT "ApplicationNumber","NumResidentialUnits","ReceivedDate","PlanningAuthority" FROM "8d5bbfa9-3b0c-40ac-8630-4243bed94b2d" WHERE "NumResidentialUnits" >= 3 ORDER BY "ReceivedDate" DESC NULLS LAST LIMIT 5''',
              cork_referer
          )

          result["status"] = "passed" if all(
              entry.get("http_status") == 200 and entry.get("success") is True
              for entry in result["checks"].values()
          ) else "failed"
          path = pathlib.Path("validation/building-control-compatible-live-test.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True, default=str) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          PY

      - name: Commit compatible live result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-compatible-live-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record compatible building-control live test"
            git pull --rebase origin main
            git push origin main
          fi
