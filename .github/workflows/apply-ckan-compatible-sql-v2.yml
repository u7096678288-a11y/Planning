name: Apply CKAN-compatible SQL v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ckan-compatible-sql-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply public CKAN SQL compatibility changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, minimum=1):
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count < minimum:
                  raise SystemExit(f"Expected at least {minimum} occurrence(s) in {path}, found {count}: {old[:120]!r}")
              file.write_text(content.replace(old, new), encoding="utf-8")
              print(path, "replaced", count, "occurrence(s)")

          unit_min_old = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${minUnits}'
          unit_min_new = '(("CN_Units_for_phase" >= ${minUnits}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${minUnits}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${minUnits}) OR ("CCC_Units_Completed" >= ${minUnits}))'
          unit_fixed_old = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${MIN_UNITS}'
          unit_fixed_new = '(("CN_Units_for_phase" >= ${MIN_UNITS}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${MIN_UNITS}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${MIN_UNITS}) OR ("CCC_Units_Completed" >= ${MIN_UNITS}))'
          order_old = 'ORDER BY COALESCE("CN_Date_Submitted_or_Received","CN_Validation_Date","CN_Commencement_Date","CCC_Date_Validated") DESC NULLS LAST'
          order_new = 'ORDER BY "CN_Date_Submitted_or_Received" DESC NULLS LAST, "CN_Validation_Date" DESC NULLS LAST, "CN_Commencement_Date" DESC NULLS LAST, "CCC_Date_Validated" DESC NULLS LAST'

          replace("completions-five-year.js", 'COALESCE("NumResidentialUnits",0) >= ${minUnits}', '"NumResidentialUnits" >= ${minUnits}')
          replace("completions-five-year.js", unit_min_old, unit_min_new)
          replace("completions-five-year.js", order_old, order_new)

          replace("dashboard-building-control-five-year.js", 'COALESCE("NumResidentialUnits",0) >= ${MIN_UNITS}', '"NumResidentialUnits" >= ${MIN_UNITS}')
          replace("dashboard-building-control-five-year.js", unit_fixed_old, unit_fixed_new)
          replace("dashboard-building-control-five-year.js", order_old, order_new, minimum=2)

          old_reference = '''          .forEach(token => clauses.push(`regexp_replace(upper(COALESCE("CN_Planning_Permission_Number",'')),'[^A-Z0-9]','','g') LIKE '%${sqlText(token)}%'`));'''
          new_reference = '''          .forEach(token => {
            const pattern = `%${String(token).split("").map(character => sqlText(character)).join("%")}%`;
            clauses.push(`"CN_Planning_Permission_Number" ILIKE '${pattern}'`);
          });'''
          replace("dashboard-building-control-five-year.js", old_reference, new_reference)

          old_spatial = '''    const spatial = coordinateClause(box);
    if (spatial) {
      await collect(`SELECT ${selected} FROM "${NBCO_RESOURCE}" WHERE "CN_Number" IS NOT NULL AND ${unitClause} AND ${dateClause} AND ${spatial} ${order}`);
    }
'''
          dashboard = Path("dashboard-building-control-five-year.js")
          content = dashboard.read_text(encoding="utf-8")
          if old_spatial in content:
              content = content.replace(old_spatial, "")
          else:
              legacy_spatial = '''    const spatial = coordinateClause(box);
    if (spatial) {
      await collect(`SELECT ${selected} FROM "${NBCO_RESOURCE}" WHERE "CN_Number" IS NOT NULL AND ${unitClause} AND ${dateClause} AND ${spatial} ORDER BY "CN_Date_Submitted_or_Received" DESC NULLS LAST, "CN_Validation_Date" DESC NULLS LAST, "CN_Commencement_Date" DESC NULLS LAST, "CCC_Date_Validated" DESC NULLS LAST`);
    }
'''
              if legacy_spatial not in content:
                  raise SystemExit("Dashboard spatial query block not found")
              content = content.replace(legacy_spatial, "")
          dashboard.write_text(content, encoding="utf-8")

          validation_unit_old = 'GREATEST(COALESCE(\\"CN_Units_for_phase\\",0),COALESCE(\\"CN_Total_Number_of_Dwelling_Units\\",0),COALESCE(\\"CN_Total_Number_Multiple_Unit_Dwellings\\",0),COALESCE(\\"CCC_Units_Completed\\",0)) >= 3'
          validation_unit_new = '((\\"CN_Units_for_phase\\" >= 3) OR (\\"CN_Total_Number_of_Dwelling_Units\\" >= 3) OR (\\"CN_Total_Number_Multiple_Unit_Dwellings\\" >= 3) OR (\\"CCC_Units_Completed\\" >= 3))'
          replace(".github/workflows/building-control-validation.yml", validation_unit_old, validation_unit_new)
          replace(".github/workflows/building-control-validation.yml", 'COALESCE(\\"NumResidentialUnits\\",0) >= 3', '\\"NumResidentialUnits\\" >= 3')
          replace(".github/workflows/building-control-post-test.yml", validation_unit_old, validation_unit_new)
          replace(".github/workflows/building-control-post-test.yml", 'COALESCE(\\"NumResidentialUnits\\",0) >= 3', '\\"NumResidentialUnits\\" >= 3')

          for path in ["completions.html", ".github/workflows/building-control-validation.yml"]:
              replace(path, 'building-control-match-core.js?v=20260804-1', 'building-control-match-core.js?v=20260804-2')
              replace(path, 'completions-five-year.js?v=20260804-1', 'completions-five-year.js?v=20260804-2')
          replace("export-share.js", 'building-control-match-core.js?v=20260804-1', 'building-control-match-core.js?v=20260804-2')
          replace("export-share.js", 'dashboard-building-control-five-year.js?v=20260804-1', 'dashboard-building-control-five-year.js?v=20260804-2')
          replace(".github/workflows/building-control-validation.yml", 'dashboard-building-control-five-year.js?v=20260804-1', 'dashboard-building-control-five-year.js?v=20260804-2')
          replace("index.html", 'export-share.js?v=20260803-18', 'export-share.js?v=20260804-1')
          PY

      - name: Validate patched code
        run: |
          node --check building-control-match-core.js
          node --check completions-five-year.js
          node --check dashboard-building-control-five-year.js
          node tests/building-control-core.test.js
          ! grep -n 'GREATEST\|COALESCE("NumResidentialUnits"\|regexp_replace' completions-five-year.js dashboard-building-control-five-year.js

      - name: Commit and rebase compatible patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add completions-five-year.js dashboard-building-control-five-year.js completions.html export-share.js index.html .github/workflows/building-control-validation.yml .github/workflows/building-control-post-test.yml
          git commit -m "Use public CKAN-compatible building-control SQL"
          git pull --rebase origin main
          git push origin main
