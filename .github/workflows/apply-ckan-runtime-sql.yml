name: Apply CKAN runtime SQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ckan-runtime-sql.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch runtime SQL only
        run: |
          python - <<'PY'
          from pathlib import Path

          def change(path, old, new, expected=1):
              file = Path(path)
              value = file.read_text(encoding="utf-8")
              found = value.count(old)
              print(path, "found", found, "for", old[:80])
              if found < expected:
                  raise SystemExit(f"Missing expected runtime text in {path}")
              file.write_text(value.replace(old, new), encoding="utf-8")

          order_old = 'ORDER BY COALESCE("CN_Date_Submitted_or_Received","CN_Validation_Date","CN_Commencement_Date","CCC_Date_Validated") DESC NULLS LAST'
          order_new = 'ORDER BY "CN_Date_Submitted_or_Received" DESC NULLS LAST, "CN_Validation_Date" DESC NULLS LAST, "CN_Commencement_Date" DESC NULLS LAST, "CCC_Date_Validated" DESC NULLS LAST'

          change(
              "completions-five-year.js",
              'COALESCE("NumResidentialUnits",0) >= ${minUnits}',
              '"NumResidentialUnits" >= ${minUnits}'
          )
          change(
              "completions-five-year.js",
              'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${minUnits}',
              '(("CN_Units_for_phase" >= ${minUnits}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${minUnits}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${minUnits}) OR ("CCC_Units_Completed" >= ${minUnits}))'
          )
          change("completions-five-year.js", order_old, order_new)

          change(
              "dashboard-building-control-five-year.js",
              'COALESCE("NumResidentialUnits",0) >= ${MIN_UNITS}',
              '"NumResidentialUnits" >= ${MIN_UNITS}'
          )
          change(
              "dashboard-building-control-five-year.js",
              'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${MIN_UNITS}',
              '(("CN_Units_for_phase" >= ${MIN_UNITS}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${MIN_UNITS}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${MIN_UNITS}) OR ("CCC_Units_Completed" >= ${MIN_UNITS}))'
          )
          change("dashboard-building-control-five-year.js", order_old, order_new, expected=2)

          reference_old = '''          .forEach(token => clauses.push(`regexp_replace(upper(COALESCE("CN_Planning_Permission_Number",'')),'[^A-Z0-9]','','g') LIKE '%${sqlText(token)}%'`));'''
          reference_new = '''          .forEach(token => {
            const pattern = `%${String(token).split("").map(character => sqlText(character)).join("%")}%`;
            clauses.push(`"CN_Planning_Permission_Number" ILIKE '${pattern}'`);
          });'''
          change("dashboard-building-control-five-year.js", reference_old, reference_new)
          PY

      - name: Validate runtime files
        run: |
          node --check completions-five-year.js
          node --check dashboard-building-control-five-year.js
          node tests/building-control-core.test.js
          ! grep -n 'GREATEST\|COALESCE("NumResidentialUnits"\|regexp_replace' completions-five-year.js dashboard-building-control-five-year.js

      - name: Commit with current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add completions-five-year.js dashboard-building-control-five-year.js
          git commit -m "Use CKAN-compatible runtime SQL"
          git pull --rebase origin main
          git push origin main
