name: Apply CKAN-compatible SQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ckan-compatible-sql.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Replace restricted CKAN SQL functions
        run: |
          python - <<'PY'
          from pathlib import Path

          def update(path, replacements):
              file = Path(path)
              value = file.read_text(encoding="utf-8")
              original = value
              for old, new in replacements:
                  if old not in value:
                      raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
                  value = value.replace(old, new)
              if value == original:
                  raise SystemExit(f"No change made to {path}")
              file.write_text(value, encoding="utf-8")

          unit_min = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${minUnits}'
          unit_min_plain = '(("CN_Units_for_phase" >= ${minUnits}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${minUnits}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${minUnits}) OR ("CCC_Units_Completed" >= ${minUnits}))'
          unit_fixed = 'GREATEST(COALESCE("CN_Units_for_phase",0),COALESCE("CN_Total_Number_of_Dwelling_Units",0),COALESCE("CN_Total_Number_Multiple_Unit_Dwellings",0),COALESCE("CCC_Units_Completed",0)) >= ${MIN_UNITS}'
          unit_fixed_plain = '(("CN_Units_for_phase" >= ${MIN_UNITS}) OR ("CN_Total_Number_of_Dwelling_Units" >= ${MIN_UNITS}) OR ("CN_Total_Number_Multiple_Unit_Dwellings" >= ${MIN_UNITS}) OR ("CCC_Units_Completed" >= ${MIN_UNITS}))'
          order_old = 'ORDER BY COALESCE("CN_Date_Submitted_or_Received","CN_Validation_Date","CN_Commencement_Date","CCC_Date_Validated") DESC NULLS LAST'
          order_new = 'ORDER BY "CN_Date_Submitted_or_Received" DESC NULLS LAST, "CN_Validation_Date" DESC NULLS LAST, "CN_Commencement_Date" DESC NULLS LAST, "CCC_Date_Validated" DESC NULLS LAST'

          update("completions-five-year.js", [
              ('COALESCE("NumResidentialUnits",0) >= ${minUnits}', '"NumResidentialUnits" >= ${minUnits}'),
              (unit_min, unit_min_plain),
              (order_old, order_new)
          ])

          reference_old = '''.forEach(token => clauses.push(`regexp_replace(upper(COALESCE("CN_Planning_Permission_Number",'')),'[^A-Z0-9]','','g') LIKE '%${sqlText(token)}%'`));'''
          reference_new = '''.forEach(token => {
            const pattern = `%${String(token).split("").map(character => sqlText(character)).join("%")}%`;
            clauses.push(`"CN_Planning_Permission_Number" ILIKE '${pattern}'`);
          });'''
          update("dashboard-building-control-five-year.js", [
              ('COALESCE("NumResidentialUnits",0) >= ${MIN_UNITS}', '"NumResidentialUnits" >= ${MIN_UNITS}'),
              (unit_fixed, unit_fixed_plain),
              (order_old, order_new),
              (reference_old, reference_new)
          ])

          validation_unit_old = 'GREATEST(COALESCE(\"CN_Units_for_phase\",0),COALESCE(\"CN_Total_Number_of_Dwelling_Units\",0),COALESCE(\"CN_Total_Number_Multiple_Unit_Dwellings\",0),COALESCE(\"CCC_Units_Completed\",0)) >= 3'
          validation_unit_new = '((\"CN_Units_for_phase\" >= 3) OR (\"CN_Total_Number_of_Dwelling_Units\" >= 3) OR (\"CN_Total_Number_Multiple_Unit_Dwellings\" >= 3) OR (\"CCC_Units_Completed\" >= 3))'
          update(".github/workflows/building-control-validation.yml", [
              (validation_unit_old, validation_unit_new),
              ('COALESCE(\"NumResidentialUnits\",0) >= 3', '\"NumResidentialUnits\" >= 3'),
              ('building-control-match-core.js?v=20260804-1', 'building-control-match-core.js?v=20260804-2'),
              ('completions-five-year.js?v=20260804-1', 'completions-five-year.js?v=20260804-2'),
              ('dashboard-building-control-five-year.js?v=20260804-1', 'dashboard-building-control-five-year.js?v=20260804-2')
          ])

          update(".github/workflows/building-control-post-test.yml", [
              (validation_unit_old, validation_unit_new),
              ('COALESCE(\"NumResidentialUnits\",0) >= 3', '\"NumResidentialUnits\" >= 3')
          ])

          update("completions.html", [
              ('building-control-match-core.js?v=20260804-1', 'building-control-match-core.js?v=20260804-2'),
              ('completions-five-year.js?v=20260804-1', 'completions-five-year.js?v=20260804-2')
          ])

          update("export-share.js", [
              ('building-control-match-core.js?v=20260804-1', 'building-control-match-core.js?v=20260804-2'),
              ('dashboard-building-control-five-year.js?v=20260804-1', 'dashboard-building-control-five-year.js?v=20260804-2')
          ])

          update("index.html", [
              ('export-share.js?v=20260803-18', 'export-share.js?v=20260804-1')
          ])
          PY

      - name: Validate patched JavaScript and matching logic
        run: |
          node --check building-control-match-core.js
          node --check completions-five-year.js
          node --check dashboard-building-control-five-year.js
          node tests/building-control-core.test.js

      - name: Commit compatible SQL patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add building-control-match-core.js completions-five-year.js dashboard-building-control-five-year.js completions.html export-share.js index.html tests/building-control-core.test.js .github/workflows/building-control-validation.yml .github/workflows/building-control-post-test.yml
          git commit -m "Use CKAN-compatible building-control SQL"
          git push
