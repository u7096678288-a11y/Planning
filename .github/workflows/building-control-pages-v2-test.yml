name: Verify corrected building-control publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/building-control-pages-v2-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live Pages and corrected SQL
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import subprocess
          import time

          base = "https://u7096678288-a11y.github.io/Planning/"
          result = {"checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(), "checks": {}}

          def get(path):
              return subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--location", "--compressed", "--max-time", "45", base + path],
                  check=True,
                  capture_output=True,
                  text=True
              ).stdout

          page = ""
          dashboard = ""
          export = ""
          for _ in range(18):
              try:
                  page = get("completions.html")
                  dashboard = get("")
                  export = get("export-share.js?v=20260804-2")
                  if (
                      "building-control-match-core.js?v=20260804-2" in page
                      and "completions-five-year.js?v=20260804-2" in page
                      and "export-share.js?v=20260804-2" in dashboard
                      and "dashboard-building-control-five-year.js?v=20260804-2" in export
                  ):
                      break
              except Exception:
                  pass
              time.sleep(10)

          audit = get("completions-five-year.js?v=20260804-2")
          live = get("dashboard-building-control-five-year.js?v=20260804-2")
          restricted = [
              value for value in ["GREATEST(COALESCE", 'COALESCE("NumResidentialUnits",0)', "regexp_replace(upper(COALESCE"]
              if value in audit or value in live
          ]
          checks = {
              "completions_page_v2": "building-control-match-core.js?v=20260804-2" in page and "completions-five-year.js?v=20260804-2" in page,
              "dashboard_loader_v2": "export-share.js?v=20260804-2" in dashboard and "dashboard-building-control-five-year.js?v=20260804-2" in export,
              "audit_asset_length": len(audit),
              "dashboard_asset_length": len(live),
              "restricted_sql_remaining": restricted
          }
          result["checks"] = checks
          result["status"] = "passed" if checks["completions_page_v2"] and checks["dashboard_loader_v2"] and len(audit) > 1000 and len(live) > 1000 and not restricted else "failed"
          path = pathlib.Path("validation/building-control-pages-v2-test.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit Pages result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-pages-v2-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected building-control Pages test"
            git pull --rebase origin main
            git push origin main
          fi
