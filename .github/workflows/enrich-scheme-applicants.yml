name: Enrich residential scheme applicants
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-scheme-applicants.yml'
      - 'preview-r6/scripts/enrich_applicants.py'
      - 'preview-r6/scripts/test_enrich_applicants.py'
  schedule:
    - cron: '21 4 * * *'
permissions:
  contents: write
concurrency:
  group: enrich-scheme-applicants
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test applicant extraction and provenance safeguards
        run: python preview-r6/scripts/test_enrich_applicants.py
      - name: Fetch verified applicant names from public planning records
        run: python preview-r6/scripts/enrich_applicants.py
      - name: Commit preview-only enrichment dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-r6/data/applicant-enrichment.json
          if git diff --cached --quiet; then
            echo "No applicant enrichment changes"
          else
            git commit -m "Update verified residential applicant enrichment [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
