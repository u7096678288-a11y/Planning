name: Index major residential scheme applicants
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-scheme-applicants.yml'
      - 'preview-r9/scripts/build_major_schemes.py'
      - 'preview-r9/scripts/enrich_applicants.py'
      - 'preview-r9/scripts/test_enrich_applicants.py'
      - 'preview-r9/scripts/major_scheme_logic.py'
      - 'preview-r9/scripts/test_major_scheme_logic.py'
  schedule:
    - cron: '21 4 * * *'
permissions:
  contents: write
concurrency:
  group: enrich-scheme-applicants
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test applicant extraction and provenance safeguards
        run: python preview-r9/scripts/test_enrich_applicants.py
      - name: Test scheme names, unit parsing and deduplication
        run: python preview-r9/scripts/test_major_scheme_logic.py
      - name: Check Python catalogue builder syntax
        run: python -m py_compile preview-r9/scripts/build_major_schemes.py preview-r9/scripts/major_scheme_logic.py
      - name: Scan all applications over 100 homes and enrich missing applicant names
        run: python preview-r9/scripts/build_major_schemes.py
      - name: Commit preview-only enrichment dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-r9/data/major-schemes.json preview-r9/data/applicant-enrichment.json
          if git diff --cached --quiet; then
            echo "No applicant enrichment changes"
          else
            git commit -m "Update major scheme applicant catalogue [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
