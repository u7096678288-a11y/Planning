name: Verify current building-control publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/building-control-pages-v3-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current live assets
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import subprocess
          import time

          base = "https://u7096678288-a11y.github.io/Planning/"
          def get(path):
              return subprocess.run(["curl","--fail","--silent","--show-error","--location","--compressed","--max-time","45",base+path],check=True,capture_output=True,text=True).stdout

          result = {"checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(), "checks": {}}
          last = {}
          for _ in range(12):
              try:
                  last = {
                      "page": get("completions.html"),
                      "index": get(""),
                      "loader": get("export-share.js?v=20260804-2"),
                      "audit": get("completions-five-year.js?v=20260804-2"),
                      "dashboard": get("dashboard-building-control-five-year.js?v=20260804-2")
                  }
                  if (
                      "building-control-match-core.js?v=20260804-2" in last["page"]
                      and "completions-five-year.js?v=20260804-2" in last["page"]
                      and "export-share.js?v=20260804-2" in last["index"]
                      and "dashboard-building-control-five-year.js?v=20260804-2" in last["loader"]
                  ):
                      break
              except Exception:
                  pass
              time.sleep(10)

          restricted = [term for term in ["GREATEST(COALESCE", 'COALESCE("NumResidentialUnits",0)', "regexp_replace(upper(COALESCE"] if term in last.get("audit","") or term in last.get("dashboard","")]
          result["checks"] = {
              "standalone_page_v2": "building-control-match-core.js?v=20260804-2" in last.get("page","") and "completions-five-year.js?v=20260804-2" in last.get("page",""),
              "main_dashboard_v2": "export-share.js?v=20260804-2" in last.get("index","") and "dashboard-building-control-five-year.js?v=20260804-2" in last.get("loader",""),
              "audit_asset_length": len(last.get("audit","")),
              "dashboard_asset_length": len(last.get("dashboard","")),
              "restricted_sql_remaining": restricted
          }
          result["status"] = "passed" if result["checks"]["standalone_page_v2"] and result["checks"]["main_dashboard_v2"] and result["checks"]["audit_asset_length"] > 1000 and result["checks"]["dashboard_asset_length"] > 1000 and not restricted else "failed"
          path = pathlib.Path("validation/building-control-pages-v3-test.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Commit publication result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/building-control-pages-v3-test.json
          if ! git diff --cached --quiet; then
            git commit -m "Record current building-control publication test"
            git pull --rebase origin main
            git push origin main
          fi
