name: Bump building-control cache keys

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-building-control-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump runtime asset versions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "completions.html": [
                  ("building-control-match-core.js?v=20260804-1", "building-control-match-core.js?v=20260804-2"),
                  ("completions-five-year.js?v=20260804-1", "completions-five-year.js?v=20260804-2")
              ],
              "export-share.js": [
                  ("building-control-match-core.js?v=20260804-1", "building-control-match-core.js?v=20260804-2"),
                  ("dashboard-building-control-five-year.js?v=20260804-1", "dashboard-building-control-five-year.js?v=20260804-2")
              ],
              "index.html": [
                  ("export-share.js?v=20260803-19", "export-share.js?v=20260804-2")
              ]
          }
          for path, pairs in replacements.items():
              file = Path(path)
              value = file.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in value:
                      raise SystemExit(f"Missing cache key in {path}: {old}")
                  value = value.replace(old, new)
              file.write_text(value, encoding="utf-8")
          PY

      - name: Commit cache keys against current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add completions.html export-share.js index.html
          git commit -m "Refresh five-year building-control assets"
          git pull --rebase origin main
          git push origin main
